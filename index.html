<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能运维指挥监控中心 · 全生命周期看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        /* 动态主题 CSS 变量 */
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --header-border: rgba(30, 41, 59, 0.8);
            --drawer-bg: rgba(15, 23, 42, 0.96);
            --badge-bg: rgba(2, 6, 23, 0.6);
        }

        /* 浅色（白天）模式变量覆盖 */
        body.light-theme {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.82);
            --border-color: rgba(203, 213, 225, 0.8);
            --text-main: #0f172a;
            --text-sub: #475569;
            --header-border: rgba(226, 232, 240, 1);
            --drawer-bg: rgba(255, 255, 255, 0.98);
            --badge-bg: rgba(241, 245, 249, 0.9);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* 毛玻璃卡片系统 */
        .hud-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        body:not(.light-theme) .hud-card {
            box-shadow: 0 10px 32px 0 rgba(0, 0, 0, 0.45);
        }
        .hud-card:hover {
            border-color: rgba(6, 182, 212, 0.5);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: rgba(6, 182, 212, 0.15);
            color: #06b6d4;
            border-bottom: 2px solid #06b6d4;
        }

        /* 背景画布绝对层 */
        #dynamic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.3); } }
        .radar-pulse { animation: pulse-dot 2s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 md:px-8 font-sans pb-28">
    <!-- 动态跳动背景画布 -->
    <canvas id="dynamic-canvas"></canvas>

    <div class="max-w-[1600px] mx-auto relative z-10">
        <!-- 顶栏导航 -->
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center pb-6 mb-6 gap-4 border-b" style="border-color: var(--header-border);">
            <div>
                <div class="flex items-center space-x-3 mb-1.5">
                    <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 radar-pulse"></span> LIVE 实时监控中
                    </span>
                    <span class="text-xs font-mono opacity-60" id="sub-title-text">FEISHU BITABLE FULL-FIELD SYNCED</span>
                </div>
                <h1 id="main-title-text" class="text-2xl md:text-4xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400">
                    落站与上线全生命周期 · 智能看板
                </h1>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <!-- 白天/黑夜模式切换器 -->
                <button onclick="toggleTheme()" id="theme-btn" class="px-3.5 py-2 rounded-xl border border-slate-700/60 hud-card text-xs font-bold transition flex items-center gap-1.5">
                    🌙 夜间模式
                </button>

                <div class="text-right mr-2 hidden sm:block">
                    <div class="text-[11px] opacity-60">数据最后同步</div>
                    <div class="font-mono text-cyan-400 font-bold text-xs" id="clock">加载中...</div>
                </div>
                <button onclick="loadData()" class="px-3 py-2 hud-card rounded-xl text-xs font-bold transition">🔄 刷新</button>
                <button onclick="toggleConfigModal()" class="px-3.5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition text-xs flex items-center gap-1.5 shadow-lg shadow-cyan-500/20">
                    ⚙️ 自定义与排版
                </button>
            </div>
        </header>

        <!-- 4大核心视图 Tab 导航 -->
        <div class="flex space-x-2 pb-3 mb-6 overflow-x-auto text-sm font-semibold border-b" style="border-color: var(--header-border);">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn active px-4 py-2 rounded-t-lg transition flex items-center gap-2">
                📊 综合调度驾驶舱
            </button>
            <button onclick="switchTab('table')" id="tab-table" class="tab-btn px-4 py-2 rounded-t-lg transition opacity-70 hover:opacity-100 flex items-center gap-2">
                📑 全字段透视明细宽表
            </button>
            <button onclick="switchTab('overdue')" id="tab-overdue" class="tab-btn px-4 py-2 rounded-t-lg transition opacity-70 hover:opacity-100 flex items-center gap-2">
                🚨 风险与倒计时预警
            </button>
        </div>

        <!-- ================= 视图 1：驾驶舱看板 ================= -->
        <div id="view-dashboard" class="space-y-6">
            <!-- KPI 汇总栏 -->
            <div id="kpi-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div data-id="kpi-total" class="hud-card rounded-2xl p-5 border-l-4 border-l-cyan-500">
                    <div class="text-xs font-medium opacity-70">接入站点总规模</div>
                    <div class="text-3xl md:text-4xl font-extrabold font-mono mt-2" id="total">--</div>
                </div>
                <div data-id="kpi-completed" class="hud-card rounded-2xl p-5 border-l-4 border-l-emerald-500">
                    <div class="text-xs font-medium opacity-70">已上线交付验收</div>
                    <div class="text-3xl md:text-4xl font-extrabold font-mono text-emerald-500 mt-2" id="completed">--</div>
                </div>
                <div data-id="kpi-in-progress" class="hud-card rounded-2xl p-5 border-l-4 border-l-amber-500">
                    <div class="text-xs font-medium opacity-70">推进攻坚中</div>
                    <div class="text-3xl md:text-4xl font-extrabold font-mono text-amber-500 mt-2" id="in_progress">--</div>
                </div>
                <div data-id="kpi-rate" class="hud-card rounded-2xl p-5 border-l-4 border-l-indigo-500">
                    <div class="text-xs font-medium opacity-70">全网验收达成率</div>
                    <div class="text-3xl md:text-4xl font-extrabold font-mono text-indigo-400 mt-2" id="rate">0%</div>
                    <div class="w-full bg-slate-500/20 rounded-full h-1.5 mt-3 overflow-hidden">
                        <div id="rate-bar" class="bg-gradient-to-r from-cyan-500 to-indigo-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 站点分屏矩阵 -->
            <div class="space-y-4">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-base font-bold flex items-center gap-2">
                        <span class="w-1.5 h-4 bg-cyan-400 rounded-full"></span> 站点全流程节点矩阵
                    </h2>
                    <span class="text-xs opacity-60">💡 提示：点击任意站点卡片右侧的「详情」，可展开全字段抽屉</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="stations-grid">
                    <div class="opacity-60 text-sm py-10">正在加载飞书数据...</div>
                </div>
            </div>
        </div>

        <!-- ================= 视图 2：全字段宽表视图 ================= -->
        <div id="view-table" class="hidden space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 p-4 rounded-2xl hud-card">
                <input type="text" id="table-search" oninput="renderFullTable()" placeholder="🔍 快速搜索任意站点名称或字段内容..." class="w-full md:w-80 bg-slate-500/10 border border-slate-500/30 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-cyan-500">
                <div class="text-xs opacity-70" id="table-count-tip">共匹配 0 条记录</div>
            </div>
            
            <div class="overflow-x-auto rounded-2xl hud-card">
                <table class="w-full text-left text-xs" id="full-data-table">
                    <thead class="bg-slate-500/10 opacity-80 font-bold border-b" style="border-color: var(--border-color);" id="table-head"></thead>
                    <tbody class="divide-y divide-slate-500/20 font-mono" id="table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- ================= 视图 3：风险倒计时预警 ================= -->
        <div id="view-overdue" class="hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="risk-grid"></div>
        </div>
    </div>

    <!-- 侧边栏全字段透视抽屉 -->
    <div id="detail-drawer" class="fixed inset-y-0 right-0 w-full max-w-lg p-6 z-50 transform translate-x-full transition duration-300 shadow-2xl flex flex-col justify-between" style="background: var(--drawer-bg); border-left: 1px solid var(--border-color);">
        <div>
            <div class="flex justify-between items-center pb-4 border-b" style="border-color: var(--border-color);">
                <div>
                    <span class="text-[10px] text-cyan-400 uppercase tracking-widest font-mono">STATION INSPECTOR</span>
                    <h3 class="text-xl font-black" id="drawer-station-name">站点详情</h3>
                </div>
                <button onclick="closeDrawer()" class="opacity-60 hover:opacity-100 text-2xl">✕</button>
            </div>
            
            <div class="mt-4 space-y-3 overflow-y-auto max-h-[75vh] pr-2 text-xs" id="drawer-fields-container"></div>
        </div>
        <div class="pt-4 border-t opacity-50 text-center text-[11px]" style="border-color: var(--border-color);">
            数据源自飞书多维表格后台 · 实时联动
        </div>
    </div>

    <!-- 自定义看板配置弹窗 -->
    <div id="config-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="hud-card w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3" style="border-color: var(--border-color);">
                <h3 class="text-lg font-bold text-cyan-400">⚙️ 看板标题与分屏个性化定制</h3>
                <button onclick="toggleConfigModal()" class="opacity-60 hover:opacity-100 text-xl">✕</button>
            </div>

            <!-- 主副标题 -->
            <div class="space-y-3">
                <label class="text-xs opacity-70 font-bold uppercase tracking-wider">大屏主/副标题定制</label>
                <div>
                    <span class="text-xs">主标题内容：</span>
                    <input id="input-main-title" class="w-full mt-1 bg-slate-500/10 border border-slate-500/30 rounded-lg p-2 text-xs" value="落站与上线全生命周期 · 智能看板">
                </div>
                <div>
                    <span class="text-xs">副标签文字：</span>
                    <input id="input-sub-title" class="w-full mt-1 bg-slate-500/10 border border-slate-500/30 rounded-lg p-2 text-xs" value="FEISHU BITABLE FULL-FIELD SYNCED">
                </div>
            </div>

            <!-- 分屏尺寸调整 -->
            <div class="space-y-2 pt-3 border-t" style="border-color: var(--border-color);">
                <label class="text-xs opacity-70 font-bold uppercase tracking-wider">站点分屏默认宽度</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setCardColumns('grid-cols-1 md:grid-cols-2 lg:grid-cols-3')" class="p-2 hud-card rounded-lg text-xs font-semibold">📱 标准 (3列)</button>
                    <button onclick="setCardColumns('grid-cols-1 md:grid-cols-2')" class="p-2 hud-card rounded-lg text-xs font-semibold">💻 宽屏半开 (2列)</button>
                    <button onclick="setCardColumns('grid-cols-1')" class="p-2 hud-card rounded-lg text-xs font-semibold">🖥️ 大屏独占 (1列)</button>
                </div>
            </div>

            <div class="flex space-x-3 pt-4 border-t" style="border-color: var(--border-color);">
                <button onclick="resetLayout()" class="w-1/2 py-2.5 rounded-xl border border-rose-500/40 text-rose-500 hover:bg-rose-500/10 text-xs font-bold transition">恢复默认</button>
                <button onclick="saveConfigModal()" class="w-1/2 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white text-xs font-black transition">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 逻辑脚本 -->
    <script>
        const API_URL = "https://yunwei-kanban-udzwfumlpl.cn-hangzhou.fcapp.run/api/data";
        let globalData = { stations: [], fields_list: [] };

        // ================= 1. 动态神经跳动背景引擎 =================
        const canvas = document.getElementById('dynamic-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let isLight = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.9;
                this.vy = (Math.random() - 0.5) * 0.9;
                this.radius = Math.random() * 2 + 1.2;
                this.pulse = Math.random() * Math.PI;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.pulse += 0.04;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                const pulseScale = Math.sin(this.pulse) * 0.8 + 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulseScale, 0, Math.PI * 2);
                ctx.fillStyle = isLight ? 'rgba(14, 165, 233, 0.45)' : 'rgba(6, 182, 212, 0.7)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 55; i++) {
            particles.push(new Particle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画粒子间的动态连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        const alpha = (1 - dist / 130) * (isLight ? 0.18 : 0.25);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = isLight ? `rgba(59, 130, 246, ${alpha})` : `rgba(6, 182, 212, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // ================= 2. 白天 / 夜晚模式自适应与切换 =================
        function initTheme() {
            const savedTheme = localStorage.getItem('cfg_theme');
            // 如果用户手动选过按选的来，否则自适应系统深浅色偏好
            if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                applyLightMode(true);
            } else {
                applyLightMode(false);
            }
        }

        function toggleTheme() {
            const currentIsLight = document.body.classList.contains('light-theme');
            applyLightMode(!currentIsLight);
        }

        function applyLightMode(light) {
            isLight = light;
            const btn = document.getElementById('theme-btn');
            if (light) {
                document.body.classList.add('light-theme');
                btn.innerHTML = '☀️ 白天模式';
                localStorage.setItem('cfg_theme', 'light');
            } else {
                document.body.classList.remove('light-theme');
                btn.innerHTML = '🌙 夜间模式';
                localStorage.setItem('cfg_theme', 'dark');
            }
        }

        // ================= 3. 看板核心业务逻辑 =================
        function initSettings() {
            initTheme();
            const savedTitle = localStorage.getItem('cfg_title') || "落站与上线全生命周期 · 智能看板";
            const savedSub = localStorage.getItem('cfg_sub') || "FEISHU BITABLE FULL-FIELD SYNCED";
            document.getElementById('main-title-text').innerText = savedTitle;
            document.getElementById('sub-title-text').innerText = savedSub;
            document.getElementById('input-main-title').value = savedTitle;
            document.getElementById('input-sub-title').value = savedSub;

            const savedCols = localStorage.getItem('cfg_card_cols') || 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3';
            document.getElementById('stations-grid').className = `grid ${savedCols} gap-4`;
        }
        initSettings();

        function switchTab(tab) {
            ['dashboard', 'table', 'overdue'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
                document.getElementById(`tab-${t}`).classList.add('opacity-70');
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.remove('opacity-70');

            if (tab === 'table') renderFullTable();
            if (tab === 'overdue') renderRiskView();
        }

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                globalData = data;

                document.getElementById('clock').innerText = data.update_time;
                document.getElementById('total').innerText = (data.total || 0) + ' 个';
                document.getElementById('completed').innerText = (data.completed || 0) + ' 个';
                document.getElementById('in_progress').innerText = (data.in_progress || 0) + ' 个';
                document.getElementById('rate').innerText = (data.rate || 0) + '%';
                document.getElementById('rate-bar').style.width = (data.rate || 0) + '%';

                renderStationsGrid();
            } catch(e) {
                console.error(e);
            }
        }

        function renderStationsGrid() {
            const grid = document.getElementById('stations-grid');
            if (globalData.stations.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center opacity-60 py-10">当前表格中暂无站点数据</div>';
                return;
            }

            grid.innerHTML = globalData.stations.map((s, idx) => `
                <div class="hud-card rounded-2xl p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-lg truncate max-w-[200px]">${s.name}</h3>
                            <span class="px-2.5 py-0.5 text-xs rounded-full font-bold ${s.is_done ? 'bg-emerald-500/20 text-emerald-500' : 'bg-amber-500/20 text-amber-500'}">
                                ${s.is_done ? '● 已验收' : '⏳ 推进中'}
                            </span>
                        </div>
                        <div class="text-xs space-y-2 py-2 border-y" style="border-color: var(--border-color);">
                            <div class="flex justify-between opacity-80"><span>T+3 节点截止</span><span class="font-mono font-bold">${s.t3}</span></div>
                            <div class="flex justify-between opacity-80"><span>T+10 节点截止</span><span class="font-mono font-bold">${s.t10}</span></div>
                            <div class="flex justify-between opacity-80"><span>路书配置状态</span><span class="text-cyan-500 font-bold">${s.roadbook}</span></div>
                        </div>
                    </div>
                    <div class="mt-4 pt-2 border-t flex justify-between items-center text-xs" style="border-color: var(--border-color);">
                        <span class="opacity-60">共 ${Object.keys(s.all_fields).length} 个业务字段</span>
                        <button onclick="openDrawer(${idx})" class="px-3 py-1 bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-500 rounded-lg font-bold transition">
                            🔍 展开全字段透视
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderFullTable() {
            const query = (document.getElementById('table-search')?.value || '').toLowerCase();
            const filtered = globalData.stations.filter(s => {
                return Object.values(s.all_fields).some(val => String(val).toLowerCase().includes(query));
            });

            document.getElementById('table-count-tip').innerText = `共匹配 ${filtered.length} 条站点记录`;

            const head = document.getElementById('table-head');
            head.innerHTML = `<tr>
                <th class="p-3">序号</th>
                <th class="p-3">站点名称</th>
                <th class="p-3">当前状态</th>
                ${globalData.fields_list.map(f => `<th class="p-3 whitespace-nowrap">${f}</th>`).join('')}
            </tr>`;

            const body = document.getElementById('table-body');
            body.innerHTML = filtered.map((s, idx) => `
                <tr class="hover:bg-slate-500/10 transition">
                    <td class="p-3 opacity-60">${idx + 1}</td>
                    <td class="p-3 font-bold whitespace-nowrap">${s.name}</td>
                    <td class="p-3 whitespace-nowrap">
                        <span class="px-2 py-0.5 rounded text-[11px] font-bold ${s.is_done ? 'bg-emerald-500/20 text-emerald-500' : 'bg-amber-500/20 text-amber-500'}">
